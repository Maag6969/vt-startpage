<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORS-test — TAI API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --som-keskmine-sinine: #4B7DFF;
    --som-tumesinine:      #181E54;
    --tekst-1:             #0e0f21;
    --tekst-2:             #52555e;
    --taust:               #ffffff;
    --joon:                #e7eaea;
    --sinine-15:           #E4ECFF;
    --positiivne:          #677c36;
    --negatiivne:          #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--taust); color: var(--tekst-1);
    font-family: "Roboto", system-ui, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .eyebrow {
    display: inline-block; background: var(--sinine-15); color: var(--som-tumesinine);
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 12px; border-radius: 999px;
  }
  h1 { color: var(--som-tumesinine); font-weight: 500; font-size: 1.6rem; margin: 12px 0 4px; }
  p.lead { color: var(--tekst-2); margin: 0 0 20px; }
  button.primary {
    font: inherit; font-size: 19px; font-weight: 700;
    background: var(--som-keskmine-sinine); color: #fff;
    border: none; border-radius: 999px; padding: 10px 24px; cursor: pointer;
  }
  button.primary:hover { filter: brightness(0.95); }
  button.primary:focus-visible { outline: 3px solid var(--som-tumesinine); outline-offset: 2px; }
  button.primary:disabled { opacity: 0.6; cursor: progress; }
  .card { border: 1px solid var(--joon); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 1rem; font-weight: 500; color: var(--som-tumesinine); margin: 0 0 8px; }
  .row { font-size: 0.9rem; margin: 4px 0; }
  .ok { color: var(--positiivne); font-weight: 500; }
  .fail { color: var(--negatiivne); font-weight: 500; }
  .muted { color: var(--tekst-2); font-size: 0.82rem; }
  pre { background: #f6f7f7; border-radius: 8px; padding: 8px; font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; }
  #env { margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">Tehniline test · etapp 2</span>
  <h1>CORS-test: TAI PxWeb API</h1>
  <p class="lead">
    Kontrollib, kas brauser lubab sellelt lehelt otse päringuid TAI statistika API-sse
    (metaandmete GET ja andmete POST) kõigi kolme tabeli jaoks.
  </p>
  <button class="primary" id="run">Käivita test</button>
  <p class="muted" id="env"></p>
  <div id="results" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  var BASE = "https://statistika.tai.ee/api/v1/et/Andmebaas/05Uuringud/01ETeU/04VaimneTervis/";

  // Small queries, confirmed against the API on 2026-09-16 (see README "Kinnitatud API-struktuur").
  var TABLES = [
    { code: "ETU41", query: [
      { code: "Aasta", selection: { filter: "item", values: ["2019"] } },
      { code: "Taustatunnus", selection: { filter: "item", values: ["0"] } },
      { code: "Depressioon", selection: { filter: "item", values: ["0", "1"] } }
    ] },
    { code: "ETU42", query: [
      { code: "Sugu", selection: { filter: "item", values: ["1", "2"] } }
    ] },
    { code: "ETU43", query: [
      { code: "Sugu", selection: { filter: "item", values: ["1", "2"] } },
      { code: "Vanuserühm", selection: { filter: "item", values: ["0"] } }
    ] }
  ];

  document.getElementById("env").textContent =
    "Lehe origin: " + location.origin + " · " + navigator.userAgent;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  async function timed(fn) {
    var t0 = performance.now();
    try {
      var value = await fn();
      return { ok: true, value: value, ms: Math.round(performance.now() - t0) };
    } catch (err) {
      return { ok: false, error: err, ms: Math.round(performance.now() - t0) };
    }
  }

  function line(label, r, detail) {
    var status = r.ok
      ? '<span class="ok">✓ õnnestus</span>'
      : '<span class="fail">✗ ebaõnnestus</span> — ' + esc(r.error && r.error.message);
    return '<div class="row">' + label + ": " + status + ' <span class="muted">(' + r.ms + " ms)</span></div>" +
      (detail ? "<pre>" + esc(detail) + "</pre>" : "");
  }

  async function testTable(t) {
    var url = BASE + t.code + ".px";

    var meta = await timed(async function () {
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });

    var data = await timed(async function () {
      var res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: t.query, response: { format: "json-stat2" } })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });

    var metaDetail = meta.ok ? "title: " + meta.value.title : null;
    var dataDetail = data.ok
      ? "id: " + data.value.id.join(", ") + "\nsize: " + data.value.size.join(", ") +
        "\nvalue: " + data.value.value.join(", ")
      : null;

    return { code: t.code, ok: meta.ok && data.ok,
      html: "<h2>" + t.code + "</h2>" + line("Metaandmed (GET)", meta, metaDetail) + line("Andmed (POST)", data, dataDetail) };
  }

  document.getElementById("run").addEventListener("click", async function () {
    var btn = this;
    var holder = document.getElementById("results");
    btn.disabled = true;
    btn.textContent = "Testin…";
    holder.innerHTML = "";

    var results = [];
    for (var i = 0; i < TABLES.length; i++) {
      var r = await testTable(TABLES[i]);
      results.push(r);
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML = r.html;
      holder.appendChild(card);
    }

    var allOk = results.every(function (r) { return r.ok; });
    var summary = document.createElement("div");
    summary.className = "card";
    summary.innerHTML = allOk
      ? '<h2>Kokkuvõte</h2><div class="row ok">Kõik päringud õnnestusid — live-fetch töötab sellelt originilt.</div>'
      : '<h2>Kokkuvõte</h2><div class="row fail">Vähemalt üks päring ebaõnnestus. „Failed to fetch“ viitab tavaliselt CORS-piirangule — ' +
        "vaata brauseri arendajatööriistade konsooli täpsemat veateadet.</div>";
    holder.insertBefore(summary, holder.firstChild);

    btn.disabled = false;
    btn.textContent = "Käivita uuesti";
  });
})();
</script>
</body>
</html>
