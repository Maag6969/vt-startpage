<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raamistiku testid</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #fff; color: #0e0f21; font-family: "Roboto", system-ui, sans-serif; line-height: 1.5; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { color: #181E54; font-weight: 500; font-size: 1.5rem; margin: 0 0 4px; }
  h2 { color: #181E54; font-weight: 500; font-size: 1.05rem; margin: 24px 0 8px; }
  p.lead { color: #52555e; margin: 0 0 16px; }
  .summary { border: 1px solid #e7eaea; border-radius: 12px; padding: 12px 16px; font-weight: 500; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { font-size: 0.9rem; padding: 4px 0; border-bottom: 1px solid #e7eaea; }
  .pass { color: #677c36; }
  .fail { color: #c0392b; }
  .detail { color: #52555e; font-size: 0.8rem; display: block; margin-left: 1.5em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Raamistiku testid</h1>
  <p class="lead">Tuummooduli (<code>js/core.js</code>) ja tabelikonfiguratsioonide kontroll: ühiktestid ilma võrguta ning
    integratsioonitestid päris TAI API vastu (oodatud väärtused kinnitatud 16.09.2026).</p>
  <div class="summary" id="summary" aria-live="polite">Testid käivad…</div>
  <h2>Ühiktestid</h2>
  <ul id="unit"></ul>
  <h2>Integratsioonitestid (TAI API)</h2>
  <ul id="integration"></ul>
</div>

<script src="../js/core.js"></script>
<script src="../js/tables/etu41.js"></script>
<script src="../js/tables/etu42.js"></script>
<script src="../js/tables/etu43.js"></script>
<script>
(async function () {
  "use strict";

  var passed = 0, failed = 0;

  function report(listId, name, ok, detail) {
    ok ? passed++ : failed++;
    var li = document.createElement("li");
    li.innerHTML = '<span class="' + (ok ? "pass" : "fail") + '">' + (ok ? "✓" : "✗") + "</span> " + TAI.escapeHtml(name) +
      (detail ? '<span class="detail">' + TAI.escapeHtml(detail) + "</span>" : "");
    document.getElementById(listId).appendChild(li);
  }

  async function test(listId, name, fn) {
    try {
      var detail = await fn();
      report(listId, name, true, detail);
    } catch (e) {
      report(listId, name, false, (e && e.name ? e.name + ": " : "") + (e && e.message));
    }
  }

  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function assertClose(actual, expected, msg) {
    assert(actual != null && Math.abs(actual - expected) < 0.051, msg + " — oodati " + expected + ", saadi " + actual);
  }
  function queryVar(body, code) {
    for (var i = 0; i < body.query.length; i++) if (body.query[i].code === code) return body.query[i].selection.values;
    return null;
  }

  // ---- ühiktestid ---------------------------------------------------

  var U = "unit";

  await test(U, "Kõik 3 tabelit on registreeritud", function () {
    var codes = TAI.getTables().map(function (t) { return t.code; });
    assert(codes.join(",") === "ETU41,ETU42,ETU43", "registris: " + codes.join(","));
  });

  await test(U, "Vigane konfiguratsioon lükatakse tagasi", function () {
    var threw = false;
    try { TAI.registerTable({ code: "X", title: "x", description: "x", years: ["1"], indicator: { var: "Puudub" }, vars: {} }); }
    catch (e) { threw = true; }
    assert(threw, "registerTable ei visanud viga");
    assert(!TAI.getTable("X"), "vigane tabel jäi registrisse");
  });

  await test(U, "buildQuery ETU42: eliminatsiooniga Sugu/Vanuserühm jäävad vaikimisi välja", function () {
    var b = TAI.buildQuery(TAI.getTable("ETU42"), {});
    assert(queryVar(b, "Sugu") === null, "Sugu oli päringus");
    assert(queryVar(b, "Vanuserühm") === null, "Vanuserühm oli päringus");
    assert(queryVar(b, "Distress").join() === "0,1", "näitaja muutuja pole täielik");
    assert(queryVar(b, "Aasta").join() === "2006,2014,2019", "aastad pole täielikud");
    assert(b.response.format === "json-stat2", "vorming");
  });

  await test(U, "buildQuery ETU43: eliminatsioonita Sugu/Vanuserühm saavad koondkategooria \"0\"", function () {
    var b = TAI.buildQuery(TAI.getTable("ETU43"), {});
    assert(queryVar(b, "Sugu").join() === "0", "Sugu: " + queryVar(b, "Sugu"));
    assert(queryVar(b, "Vanuserühm").join() === "0", "Vanuserühm: " + queryVar(b, "Vanuserühm"));
  });

  await test(U, "buildQuery lükkab tagasi tundmatu väärtuse", function () {
    var threw = false;
    try { TAI.buildQuery(TAI.getTable("ETU42"), { Sugu: ["9"] }); } catch (e) { threw = true; }
    assert(threw, "viga ei visatud");
  });

  await test(U, "selectionFromState jätab koondkategooria välja ja rakendab overrides", function () {
    var cfg = TAI.getTable("ETU41");
    var sel = TAI.selectionFromState(cfg, { Taustatunnus: "3", Sugu: "0", "Vanuserühm": "2" }, ["Taustatunnus", "Sugu", "Vanuserühm"], { Sugu: ["1", "2"] });
    assert(JSON.stringify(sel) === JSON.stringify({ Taustatunnus: ["3"], "Vanuserühm": ["2"], Sugu: ["1", "2"] }), JSON.stringify(sel));
  });

  var fixture = {
    version: "2.0", class: "dataset",
    id: ["ContentsCode", "Aasta", "Distress", "Sugu"], size: [1, 2, 2, 2],
    dimension: {
      ContentsCode: { category: { index: { "X": 0 }, label: { "X": "Osakaal" } } },
      Aasta: { category: { index: { "2014": 0, "2019": 1 }, label: { "2014": "2014", "2019": "2019" } } },
      Distress: { category: { index: { "0": 0, "1": 1 }, label: { "0": "ei", "1": "jah" } } },
      Sugu: { category: { index: ["1", "2"], label: { "1": "Mehed", "2": "Naised" } } }
    },
    // järjestus: Aasta × Distress × Sugu
    value: [93.4, 87.4, 6.6, 12.6, 91, 82.5, 9, null]
  };

  await test(U, "readJsonStat2: õige lahter, objekt- ja massiiv-indeks, suurusega 1 dimensioon", function () {
    var r = TAI.readJsonStat2(fixture);
    assert(r.get({ Aasta: "2014", Distress: "1", Sugu: "2" }) === 12.6, "2014/1/2");
    assert(r.get({ Aasta: "2019", Distress: "0", Sugu: "1" }) === 91, "2019/0/1");
  });

  await test(U, "readJsonStat2: puuduv suurema dimensiooni valik → undefined; null väärtus → null", function () {
    var r = TAI.readJsonStat2(fixture);
    assert(r.get({ Aasta: "2014", Distress: "1" }) === undefined, "Sugu puudumisel ei tohi lahtrit lugeda");
    assert(r.get({ Aasta: "2019", Distress: "1", Sugu: "2" }) === null, "puuduv väärtus");
    assert(r.get({ Aasta: "1999", Distress: "1", Sugu: "2" }) === undefined, "tundmatu kood");
  });

  await test(U, "readJsonStat2: tundmatu struktuur → DataError", function () {
    try { TAI.readJsonStat2({ foo: 1 }); } catch (e) { assert(e instanceof TAI.DataError, "vale veatüüp " + e.name); return; }
    throw new Error("viga ei visatud");
  });

  await test(U, "indicatorShare: osakaal ja puuduva väärtuse käsitlus", function () {
    var r = TAI.readJsonStat2(fixture);
    var cfg = TAI.getTable("ETU42");
    assertClose(TAI.indicatorShare(r, cfg, { Aasta: "2014", Sugu: "2" }), 12.6, "2014 naised");
    assert(TAI.indicatorShare(r, cfg, { Aasta: "2019", Sugu: "2" }) === null, "puuduv väärtus peab andma null");
  });

  await test(U, "formatPct ja delta (eesti formaat)", function () {
    assert(TAI.formatPct(12.34) === "12,3%", TAI.formatPct(12.34));
    assert(TAI.formatPct(null) === "–", "null");
    var d = TAI.delta(17.5, 12.6);
    assert(d.direction === "up" && d.text === "▲ 4,9 protsendipunkti", d.text);
    assert(TAI.delta(10, 10.02).direction === "flat", "flat");
  });

  await test(U, "describeError: veatüübid ja üleslaadimise pakkumine", function () {
    assert(TAI.describeError(new TAI.NetworkError("x")).offerUpload === true, "Network");
    assert(TAI.describeError(new TAI.HttpError("x", { status: 400 })).offerUpload === false, "HTTP 400");
    assert(/429/.test(TAI.describeError(new TAI.HttpError("x", { status: 429 })).title), "HTTP 429 pealkiri");
  });

  await test(U, "readUploadedFile: korrektne fail, vale JSON ja vale tabel", async function () {
    var cfg = TAI.getTable("ETU42");
    var ok = await TAI.readUploadedFile(new File([JSON.stringify(fixture)], "etu42.json"), cfg);
    assert(ok.get({ Aasta: "2014", Distress: "1", Sugu: "1" }) === 6.6, "loetud väärtus");
    try { await TAI.readUploadedFile(new File(["{katki"], "x.json"), cfg); throw new Error("vale JSON läbis"); }
    catch (e) { assert(e instanceof TAI.DataError, "vale JSON: " + e.message); }
    try { await TAI.readUploadedFile(new File([JSON.stringify(fixture)], "x.json"), TAI.getTable("ETU43")); throw new Error("vale tabel läbis"); }
    catch (e) { assert(e instanceof TAI.DataError, "vale tabel: " + e.message); }
  });

  // ---- integratsioonitestid ----------------------------------------

  var I = "integration";

  await test(I, "ETU41 trend: taustatunnus kokku, mehed ja naised kokku, 2019 = 10,9%", async function () {
    var cfg = TAI.getTable("ETU41");
    var data = await TAI.loadTable(cfg, { Taustatunnus: "0", Sugu: "0", "Vanuserühm": "0" });
    var v = TAI.indicatorShare(data.trend, cfg, { Aasta: "2019", Taustatunnus: "0" });
    assertClose(v, 10.9, "2019");
    var bars = cfg.vars.Taustatunnus.values.map(function (t) { return TAI.indicatorShare(data.breakdown, cfg, { Aasta: "2019", Taustatunnus: t }); });
    assert(bars.every(function (b) { return b != null; }), "breakdown: mõni taustatunnus puudub");
    return "2006/2014/2019: " + cfg.years.map(function (y) { return TAI.formatPct(TAI.indicatorShare(data.trend, cfg, { Aasta: y, Taustatunnus: "0" })); }).join(" / ");
  });

  await test(I, "ETU42 trend koondina: 12,3 / 9,8 / 13,6%", async function () {
    var cfg = TAI.getTable("ETU42");
    var data = await TAI.loadTable(cfg, { Sugu: "0", "Vanuserühm": "0" });
    assertClose(TAI.indicatorShare(data.trend, cfg, { Aasta: "2006" }), 12.3, "2006");
    assertClose(TAI.indicatorShare(data.trend, cfg, { Aasta: "2014" }), 9.8, "2014");
    assertClose(TAI.indicatorShare(data.trend, cfg, { Aasta: "2019" }), 13.6, "2019");
    var ages = cfg.vars["Vanuserühm"].values.map(function (a) { return TAI.indicatorShare(data.breakdown, cfg, { Aasta: "2019", "Vanuserühm": a }); });
    assert(ages.every(function (a) { return a != null; }), "breakdown: mõni vanuserühm puudub");
  });

  await test(I, "ETU42 meeste ja naiste võrdlus: 2006 mehed 7,4%, 2019 naised 17,5%", async function () {
    var cfg = TAI.getTable("ETU42");
    var data = await TAI.loadTable(cfg, { Sugu: "0", "Vanuserühm": "0", compareSexes: true });
    assertClose(TAI.indicatorShare(data.trend, cfg, { Aasta: "2006", Sugu: "1" }), 7.4, "2006 mehed");
    assertClose(TAI.indicatorShare(data.trend, cfg, { Aasta: "2019", Sugu: "2" }), 17.5, "2019 naised");
  });

  await test(I, "ETU43 koond: ebapiisav uneaeg 26,2%", async function () {
    var cfg = TAI.getTable("ETU43");
    var data = await TAI.loadTable(cfg, { Sugu: "0" });
    assertClose(TAI.indicatorShare(data.breakdown, cfg, { Aasta: "2019", Sugu: "0", "Vanuserühm": "0" }), 26.2, "kokku");
    assert(!("trend" in data), "ETU43-l ei tohi olla trendipäringut");
  });

  await test(I, "ETU43 võrdlus: mehed 24,7%, naised 27,4%, mehed 15–24 40,1%", async function () {
    var cfg = TAI.getTable("ETU43");
    var data = await TAI.loadTable(cfg, { compareSexes: true });
    assertClose(TAI.indicatorShare(data.breakdown, cfg, { Aasta: "2019", Sugu: "1", "Vanuserühm": "0" }), 24.7, "mehed");
    assertClose(TAI.indicatorShare(data.breakdown, cfg, { Aasta: "2019", Sugu: "2", "Vanuserühm": "0" }), 27.4, "naised");
    assertClose(TAI.indicatorShare(data.breakdown, cfg, { Aasta: "2019", Sugu: "1", "Vanuserühm": "1" }), 40.1, "mehed 15–24");
  });

  await test(I, "Vigane päring → HttpError 400 ilma üleslaadimise pakkumiseta", async function () {
    var cfg = TAI.getTable("ETU42");
    try {
      await TAI.fetchJsonStat2(cfg, { query: [{ code: "Olematu", selection: { filter: "item", values: ["0"] } }], response: { format: "json-stat2" } });
    } catch (e) {
      assert(e instanceof TAI.HttpError, "vale veatüüp: " + e.name + " " + e.message);
      return TAI.describeError(e).title;
    }
    throw new Error("viga ei visatud");
  });

  var s = document.getElementById("summary");
  s.textContent = failed ? "✗ " + failed + " testi ebaõnnestus, " + passed + " õnnestus" : "✓ Kõik " + passed + " testi õnnestusid";
  s.className = "summary " + (failed ? "fail" : "pass");
  window.__testResult = { passed: passed, failed: failed };
})();
</script>
</body>
</html>
